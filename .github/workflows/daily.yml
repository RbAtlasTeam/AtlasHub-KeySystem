name: Daily Key

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Key
        run: |
          PART1=$(printf "%04d" $((RANDOM % 10000)))
          PART2=$(printf "%04d" $((RANDOM % 10000)))
          KEY="ATLAS-$PART1-$PART2"

          echo "return \"$KEY\"" > key.txt
          echo "KEY=$KEY" >> "$GITHUB_ENV"

      - name: Save Key
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add key.txt
          git commit -m "Update daily key" || exit 0
          git push

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.ATLASHUB_KEYSYSTEM }}
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"AtlasHub Key\",\"description\":\"Key: \`$KEY\`\",\"color\":3447003}]}" \
            "$DISCORD_WEBHOOK"
